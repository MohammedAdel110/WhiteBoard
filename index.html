<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Lumen Board — Digital Whiteboard for Teaching</title>
<meta name="description" content="A fast, beautiful digital whiteboard for live teaching: smooth pen, highlighter, laser pointer, sticky notes, code blocks, multi-page lessons, spotlight mode and high-resolution export." />
<meta name="theme-color" content="#4f46e5" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f46e5'/%3E%3Cpath d='M16 42c8-14 14-20 20-20s4 10 12 4' stroke='white' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
<script>
  /* Apply saved theme before paint to avoid a flash */
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('lumenboard.prefs.v1') || '{}');
      var dark = p.theme ? p.theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) {}
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: { fontFamily: {
      sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
      mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Consolas', 'monospace']
    } } }
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
  :root { --board-bg:#f6f6f3; --dot:#c3c7cf; --grid:#e2e5ea; --line:#d3deee; --accent:#4f46e5; --z:1; }
  .dark { --board-bg:#1a1b1e; --dot:#3c4049; --grid:#2a2d34; --line:#2c3547; }
  html, body { height:100%; margin:0; overflow:hidden; overscroll-behavior:none; }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: var(--board-bg); }
  button { -webkit-tap-highlight-color: transparent; }

  /* ---------- Board ---------- */
  #board { position:fixed; inset:0; overflow:hidden; background-color:var(--board-bg); touch-action:none; user-select:none; -webkit-user-select:none; transition: background-color .3s; }
  #board[data-tool="select"] { cursor:default; }
  #board[data-tool="pen"], #board[data-tool="highlighter"], #board[data-tool="shape"] { cursor:crosshair; }
  #board[data-tool="eraser"], #board[data-tool="laser"] { cursor:none; }
  #board.space, #board.space * { cursor:grab !important; }
  #board.panning, #board.panning * { cursor:grabbing !important; }
  canvas.layer { position:absolute; left:0; top:0; pointer-events:none; }
  #widgetLayer { position:absolute; left:0; top:0; width:0; height:0; transform-origin:0 0; }
  #board.drawmode #widgetLayer, #board.drawmode #widgetLayer * { pointer-events:none !important; }
  #board.flip #widgetLayer, #board.flip #ink { animation: pageIn .22s ease-out; }
  @keyframes pageIn { from { opacity:0; transform-origin:center; } to { opacity:1; } }
  #cursorRing { position:fixed; left:0; top:0; pointer-events:none; z-index:30; border-radius:50%; border:1.5px solid rgba(15,23,42,.65); background:rgba(255,255,255,.35); box-shadow:0 0 0 1px rgba(255,255,255,.7); transform:translate(-50%,-50%); display:none; }
  .dark #cursorRing { border-color:rgba(255,255,255,.8); background:rgba(255,255,255,.08); box-shadow:0 0 0 1px rgba(0,0,0,.6); }

  /* ---------- Glass chrome ---------- */
  .glass { background:rgba(255,255,255,.74); -webkit-backdrop-filter:blur(14px) saturate(1.5); backdrop-filter:blur(14px) saturate(1.5); border:1px solid rgba(15,23,42,.08); box-shadow:0 12px 32px -12px rgba(15,23,42,.28), 0 2px 6px rgba(15,23,42,.06); }
  .dark .glass { background:rgba(32,33,38,.74); border-color:rgba(255,255,255,.08); box-shadow:0 12px 32px -12px rgba(0,0,0,.65), 0 2px 6px rgba(0,0,0,.3); }
  .btn { position:relative; display:inline-flex; align-items:center; justify-content:center; gap:6px; height:36px; min-width:36px; padding:0 8px; border-radius:12px; color:#334155; transition:background .15s, color .15s, transform .12s; white-space:nowrap; }
  .btn:hover { background:rgba(15,23,42,.06); }
  .btn:active { transform:scale(.94); }
  .btn.on { background:rgba(79,70,229,.12); color:#4338ca; }
  .dark .btn { color:#cbd5e1; } .dark .btn:hover { background:rgba(255,255,255,.08); } .dark .btn.on { background:rgba(129,140,248,.18); color:#c7d2fe; }
  .btn svg { width:18px; height:18px; flex-shrink:0; }
  .btn.sm { height:30px; min-width:30px; padding:0 6px; border-radius:9px; }
  .btn.sm svg { width:16px; height:16px; }
  .btn[disabled] { opacity:.32; pointer-events:none; }
  .sep { width:1px; height:22px; background:rgba(15,23,42,.1); margin:0 4px; flex-shrink:0; }
  .dark .sep { background:rgba(255,255,255,.1); }
  .kbd { font:600 10px/1 'JetBrains Mono', monospace; padding:3px 5px; border-radius:5px; background:rgba(15,23,42,.06); color:#64748b; border:1px solid rgba(15,23,42,.08); }
  .dark .kbd { background:rgba(255,255,255,.07); color:#94a3b8; border-color:rgba(255,255,255,.08); }
  .badge { position:absolute; top:2px; right:1px; min-width:15px; height:15px; padding:0 4px; border-radius:99px; background:#4f46e5; color:#fff; font:700 9px/15px Inter, sans-serif; }
  .title-input { height:34px; padding:0 8px; border-radius:10px; background:transparent; font-weight:600; font-size:14px; color:inherit; outline:none; border:1px solid transparent; min-width:60px; max-width:260px; transition:border-color .15s, background .15s; }
  .title-input:hover { background:rgba(15,23,42,.04); } .dark .title-input:hover { background:rgba(255,255,255,.05); }
  .title-input:focus { border-color:rgba(79,70,229,.5); background:rgba(255,255,255,.6); } .dark .title-input:focus { background:rgba(0,0,0,.2); }
  .save-state { display:inline-flex; align-items:center; gap:4px; font-size:11px; color:#94a3b8; padding-right:4px; }
  .save-state svg { width:14px; height:14px; }
  .i-sun { display:none; } .dark .i-sun { display:block; } .dark .i-moon { display:none; }
  .logo { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,#818cf8,#4f46e5); display:grid; place-items:center; color:#fff; box-shadow:0 4px 10px -2px rgba(79,70,229,.5); flex-shrink:0; margin:0 2px; }
  .logo svg { width:17px; height:17px; }

  /* ---------- Dock ---------- */
  #dock { position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:50; border-radius:9999px; padding:6px; display:flex; align-items:center; gap:2px; max-width:calc(100vw - 16px); overflow-x:auto; scrollbar-width:none; }
  #dock::-webkit-scrollbar { display:none; }
  .tool { position:relative; z-index:1; width:44px; height:44px; flex-shrink:0; border-radius:9999px; display:flex; align-items:center; justify-content:center; color:#475569; transition:color .2s; }
  .dark .tool { color:#cbd5e1; }
  .tool svg { width:21px; height:21px; transition:transform .28s cubic-bezier(.34,1.56,.64,1); }
  .tool:hover svg { transform:translateY(-2px) scale(1.06); }
  .tool:active svg { transform:scale(.88); }
  .tool.active { color:#fff !important; }
  .tool.active svg { transform:scale(1.08); }
  .tool:not(.active):hover { background:rgba(15,23,42,.05); } .dark .tool:not(.active):hover { background:rgba(255,255,255,.06); }
  .tool.has-menu::after { content:''; position:absolute; top:7px; right:8px; width:4px; height:4px; border-radius:50%; background:currentColor; opacity:.35; }
  .tool-dot { position:absolute; bottom:7px; right:8px; width:9px; height:9px; border-radius:50%; border:1.5px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.18); }
  .dark .tool-dot { border-color:#2a2b31; }
  #dockIndicator { position:absolute; z-index:0; left:6px; top:6px; height:44px; width:44px; border-radius:9999px; background:linear-gradient(135deg,#6366f1,#4338ca); box-shadow:0 6px 16px -4px rgba(79,70,229,.65); transition:left .38s cubic-bezier(.34,1.35,.64,1), background .3s, opacity .2s; }
  #dockIndicator.laser { background:linear-gradient(135deg,#fb7185,#e11d48); box-shadow:0 0 18px rgba(244,63,94,.75); }
  #dockIndicator::after { content:''; position:absolute; left:50%; bottom:-5px; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:#6366f1; }
  .dock-sep { width:1px; height:26px; margin:0 5px; background:rgba(15,23,42,.1); flex-shrink:0; }
  .dark .dock-sep { background:rgba(255,255,255,.1); }

  /* ---------- Popovers & menus ---------- */
  .pop { position:fixed; z-index:60; border-radius:18px; padding:8px; opacity:0; visibility:hidden; transform:translateY(6px) scale(.98); transition:opacity .16s, transform .18s cubic-bezier(.34,1.4,.64,1), visibility .16s; }
  .pop.open { opacity:1; visibility:visible; transform:none; }
  .menu-row { display:flex; align-items:center; gap:6px; padding:4px; }
  .menu-label { font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#94a3b8; padding:6px 6px 2px; }
  .sw { width:26px; height:26px; border-radius:50%; flex-shrink:0; box-shadow:inset 0 0 0 1px rgba(0,0,0,.14); transition:transform .15s, box-shadow .15s; }
  .sw:hover { transform:scale(1.14); }
  .sw.on { box-shadow:inset 0 0 0 1px rgba(0,0,0,.14), 0 0 0 2px #fff, 0 0 0 4px #6366f1; }
  .dark .sw.on { box-shadow:inset 0 0 0 1px rgba(0,0,0,.2), 0 0 0 2px #26272d, 0 0 0 4px #818cf8; }
  .sw.sm { width:20px; height:20px; }
  .szb { width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; color:#334155; transition:background .15s; flex-shrink:0; }
  .dark .szb { color:#e2e8f0; }
  .szb:hover { background:rgba(15,23,42,.06); } .dark .szb:hover { background:rgba(255,255,255,.08); }
  .szb.on { background:rgba(79,70,229,.14); color:#4338ca; } .dark .szb.on { background:rgba(129,140,248,.2); color:#c7d2fe; }
  .szb svg { width:18px; height:18px; }
  .szb .dot { border-radius:99px; background:currentColor; }
  .mi { display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:10px; font-size:13px; font-weight:500; text-align:left; color:#334155; transition:background .12s; white-space:nowrap; }
  .dark .mi { color:#e2e8f0; }
  .mi:hover { background:rgba(15,23,42,.06); } .dark .mi:hover { background:rgba(255,255,255,.08); }
  .mi svg { width:17px; height:17px; opacity:.8; flex-shrink:0; }
  .mi .kbd { margin-left:auto; }
  .mi.on { color:#4338ca; background:rgba(79,70,229,.1); } .dark .mi.on { color:#c7d2fe; background:rgba(129,140,248,.16); }
  .mi-sep { height:1px; margin:6px 4px; background:rgba(15,23,42,.08); } .dark .mi-sep { background:rgba(255,255,255,.08); }

  /* ---------- Context toolbar ---------- */
  #ctxBar { position:fixed; z-index:45; display:flex; align-items:center; gap:3px; padding:5px; border-radius:14px; opacity:0; visibility:hidden; transform:translateY(4px); transition:opacity .14s, transform .14s, visibility .14s; }
  #ctxBar.open { opacity:1; visibility:visible; transform:none; }
  #ctxBar .fs-label { min-width:28px; text-align:center; font:600 12px 'JetBrains Mono', monospace; color:#64748b; }
  .dark #ctxBar .fs-label { color:#94a3b8; }

  /* ---------- Widgets ---------- */
  .widget { position:absolute; box-sizing:border-box; }
  .widget textarea, .widget input { font-family:inherit; border:0; outline:0; background:transparent; resize:none; margin:0; padding:0; pointer-events:none; color:inherit; }
  .widget.editing textarea, .widget.editing input { pointer-events:auto; cursor:text; user-select:text; -webkit-user-select:text; }
  .widget.selected:not(.w-shape) { outline:calc(2px / var(--z)) solid var(--accent); outline-offset:calc(4px / var(--z)); }
  .widget.editing:not(.w-shape) { outline-style:dashed; }
  .rh, .eh { position:absolute; display:none; width:calc(14px / var(--z)); height:calc(14px / var(--z)); border-radius:50%; background:#fff; border:calc(2px / var(--z)) solid var(--accent); box-shadow:0 1px 4px rgba(0,0,0,.25); z-index:5; pointer-events:auto; }
  .rh { right:calc(-11px / var(--z)); bottom:calc(-11px / var(--z)); cursor:nwse-resize; }
  .rh.rh-x { top:50%; bottom:auto; margin-top:calc(-7px / var(--z)); cursor:ew-resize; border-radius:calc(4px / var(--z)); }
  .widget.selected .rh, .widget.selected .eh { display:block; }
  .w-shape .rh, .w-shape .eh { right:auto; bottom:auto; transform:translate(-50%,-50%); }
  .w-shape .eh { cursor:move; }

  .w-sticky { border-radius:3px; padding:16px 14px; cursor:move; box-shadow:0 1px 1px rgba(0,0,0,.06), 0 10px 18px -8px rgba(0,0,0,.3), 0 26px 36px -26px rgba(0,0,0,.35); }
  .w-sticky::after { content:''; position:absolute; right:0; bottom:0; width:22px; height:22px; background:linear-gradient(135deg, rgba(0,0,0,0) 50%, rgba(0,0,0,.08) 50%, rgba(255,255,255,.35) 100%); border-radius:0 0 3px 0; pointer-events:none; }
  .w-sticky textarea { display:block; width:100%; height:100%; overflow:hidden; color:#1f2937; font-weight:500; line-height:1.35; }
  .w-sticky textarea::placeholder { color:rgba(31,41,55,.4); }

  .w-text { padding:6px 8px; border-radius:6px; cursor:move; }
  #board:not(.drawmode) .w-text:not(.selected):hover { outline:calc(1px / var(--z)) dashed rgba(99,102,241,.55); }
  .w-text textarea { display:block; width:100%; overflow:hidden; line-height:1.3; white-space:pre-wrap; }
  .w-text textarea::placeholder { color:rgba(100,116,139,.6); }

  .w-code { background:#1e1e2e; border-radius:12px; display:flex; flex-direction:column; box-shadow:0 24px 44px -16px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06); color:#cdd6f4; }
  .w-code .code-head { height:34px; flex-shrink:0; display:flex; align-items:center; gap:8px; padding:0 10px 0 12px; background:#181825; border-radius:12px 12px 0 0; cursor:move; }
  .w-code .tl { width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  .w-code .code-title { flex:1; min-width:0; text-align:center; color:#a6adc8; font:500 12px 'JetBrains Mono', monospace; }
  .w-code .code-copy { width:24px; height:24px; border-radius:6px; display:grid; place-items:center; color:#a6adc8; pointer-events:auto; }
  .w-code .code-copy:hover { background:rgba(255,255,255,.08); color:#fff; }
  .w-code .code-copy svg { width:14px; height:14px; }
  .w-code .code-body { flex:1; display:flex; overflow:hidden; border-radius:0 0 12px 12px; cursor:move; }
  .w-code .code-gutter { padding:12px 8px 12px 12px; color:#585b70; text-align:right; font-family:'JetBrains Mono', monospace; white-space:pre; line-height:1.55; overflow:hidden; user-select:none; flex-shrink:0; }
  .w-code .code-area { flex:1; padding:12px 14px 12px 6px; color:#cdd6f4; font-family:'JetBrains Mono', monospace; line-height:1.55; white-space:pre; overflow:auto; tab-size:4; scrollbar-width:thin; scrollbar-color:#45475a transparent; }
  .w-code .rh { right:4px; bottom:4px; }

  .w-varbox { width:180px; height:210px; padding:10px; border-radius:16px; display:flex; flex-direction:column; align-items:center; gap:6px; background:#fff; border:1px solid rgba(15,23,42,.08); box-shadow:0 14px 30px -14px rgba(15,23,42,.35); cursor:move; color:#1e293b; }
  .dark .w-varbox { background:#26272d; border-color:rgba(255,255,255,.08); color:#e2e8f0; }
  .var-head { height:24px; display:flex; align-items:center; justify-content:center; gap:6px; font:600 13px 'JetBrains Mono', monospace; }
  .var-head input { font:inherit; text-align:center; }
  .var-type { color:#8b5cf6; }
  .var-stage { position:relative; width:140px; height:130px; }
  .var-token { position:absolute; left:50%; top:6px; height:34px; min-width:64px; padding:0 12px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:linear-gradient(135deg,#6366f1,#4f46e5); color:#fff; box-shadow:0 8px 18px -6px rgba(79,70,229,.7); z-index:1; transform:translateX(-50%) translateY(56px) scale(.7); opacity:0; transition:transform .55s cubic-bezier(.34,1.56,.64,1), opacity .35s; }
  .w-varbox.open .var-token { transform:translateX(-50%) translateY(0) scale(1); opacity:1; }
  .var-token input { font:700 16px 'JetBrains Mono', monospace; color:#fff; text-align:center; min-width:2ch; }
  .var-box { position:absolute; left:10px; right:10px; bottom:0; height:72px; }
  .var-front { position:absolute; inset:0; z-index:2; border-radius:4px 4px 10px 10px; background:linear-gradient(180deg,#dca46a,#c4874d); box-shadow:inset 0 -6px 0 rgba(0,0,0,.08), inset 0 2px 0 rgba(255,255,255,.25); display:flex; flex-direction:column; align-items:center; justify-content:center; color:#4a2c10; }
  .var-label { font:700 15px 'JetBrains Mono', monospace; }
  .var-addr { font:500 10px 'JetBrains Mono', monospace; opacity:.7; padding:1px 6px; border-radius:6px; transition:background .3s; }
  .w-varbox.flash .var-addr { background:rgba(255,255,255,.55); opacity:1; }
  .var-lid { position:absolute; left:-6px; right:-6px; top:-12px; height:14px; z-index:3; border-radius:4px; background:linear-gradient(180deg,#ecbc84,#d9a066); box-shadow:0 2px 4px rgba(0,0,0,.18); transform-origin:0% 100%; transition:transform .55s cubic-bezier(.34,1.56,.64,1); }
  .w-varbox.open .var-lid { transform:translateY(-3px) rotate(-28deg); }
  .var-toggle { height:24px; padding:0 12px; border-radius:99px; font:600 11px Inter, sans-serif; background:rgba(79,70,229,.1); color:#4338ca; pointer-events:auto; }
  .dark .var-toggle { background:rgba(129,140,248,.18); color:#c7d2fe; }
  .var-toggle:hover { background:rgba(79,70,229,.18); }

  .w-shape { pointer-events:none; }
  .w-shape svg { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
  .w-shape .hit { cursor:move; }
  .w-shape .selbox { display:none; }
  .w-shape.selected .selbox { display:block; }

  /* ---------- Spotlight ---------- */
  #spot { position:fixed; inset:0; z-index:35; pointer-events:none; display:none; }
  #spot.on { display:block; }
  #spotHole { position:absolute; border-radius:18px; box-shadow:0 0 0 300vmax rgba(5,8,15,var(--dim,.84)); outline:2px dashed rgba(255,255,255,.4); outline-offset:-1px; transition:border-radius .3s; }
  #spot.circle #spotHole { border-radius:50%; }
  #spot.curtain #spotHole { border-radius:0; outline:none; }
  .spot-h { position:absolute; pointer-events:auto; }
  #spotMove { left:50%; top:-15px; transform:translateX(-50%); height:30px; padding:0 12px; border-radius:99px; background:#fff; color:#334155; display:flex; align-items:center; gap:6px; font:600 11px Inter, sans-serif; cursor:move; box-shadow:0 4px 14px rgba(0,0,0,.35); }
  #spotMove svg, #spotCurtain svg { width:14px; height:14px; }
  #spotSize { right:-11px; bottom:-11px; width:22px; height:22px; border-radius:50%; background:#fff; border:3px solid #6366f1; cursor:nwse-resize; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  #spot.circle #spotSize { right:14%; bottom:14%; }
  #spotCurtain { display:none; left:50%; bottom:-17px; transform:translateX(-50%); height:34px; padding:0 14px; border-radius:99px; background:#fff; color:#334155; align-items:center; gap:6px; font:600 12px Inter, sans-serif; cursor:ns-resize; box-shadow:0 4px 14px rgba(0,0,0,.4); }
  #spot.curtain #spotMove, #spot.curtain #spotSize { display:none; }
  #spot.curtain #spotCurtain { display:flex; }

  /* ---------- Misc ---------- */
  #tooltip { position:fixed; z-index:100; pointer-events:none; padding:6px 9px; border-radius:9px; background:#0f172a; color:#f8fafc; font-size:12px; font-weight:500; display:flex; gap:8px; align-items:center; opacity:0; transform:translateY(3px); transition:opacity .12s, transform .12s; white-space:nowrap; box-shadow:0 8px 20px -6px rgba(0,0,0,.4); }
  .dark #tooltip { background:#f1f5f9; color:#0f172a; }
  #tooltip.show { opacity:1; transform:none; }
  #tooltip .k { font:600 10px 'JetBrains Mono', monospace; padding:2px 5px; border-radius:4px; background:rgba(255,255,255,.16); }
  .dark #tooltip .k { background:rgba(15,23,42,.1); }
  .toast { display:flex; align-items:center; gap:8px; padding:10px 14px; border-radius:14px; font-size:13px; font-weight:500; background:#0f172a; color:#f8fafc; box-shadow:0 12px 28px -8px rgba(0,0,0,.4); opacity:0; transform:translateY(10px) scale(.97); transition:all .25s cubic-bezier(.34,1.4,.64,1); }
  .dark .toast { background:#f1f5f9; color:#0f172a; }
  .toast.show { opacity:1; transform:none; }
  .toast svg { width:16px; height:16px; }
  .timer-run #timerText { color:#4f46e5; } .dark .timer-run #timerText { color:#a5b4fc; }
  .timer-warn #timerText { color:#e11d48 !important; }
  .timer-done { animation:timerFlash .8s ease-in-out infinite; }

    const pt = toWorld(e.clientX, e.clientY);

  timerBtn.classList.remove('timer-done');
  if (timer.running) {
    timer.rem = Math.max(0, (timer.endAt - performance.now()) / 1000);
    timer.running = false; clearInterval(timer.iv);
  } else {
    if (timer.rem <= 0) timer.rem = timer.total;
    timer.endAt = performance.now() + timer.rem * 1000;
    timer.running = true;
    clearInterval(timer.iv);
    timer.iv = setInterval(tickTimer, 200);
  }
  syncTimerUI();
}
function tickTimer() {
  timer.rem = Math.max(0, (timer.endAt - performance.now()) / 1000);
  syncTimerUI();
  if (timer.rem <= 0) {
    clearInterval(timer.iv); timer.running = false;
    timerBtn.classList.add('timer-done');
    syncTimerUI(); chime();
    toast("Time's up!", 'bell-ring');
  }
}
function syncTimerUI() {
  const s = fmtTime(timer.rem), warn = timer.running && timer.rem <= 10;
  timerText.textContent = timerBig.textContent = bigDigits.textContent = s;
  timerBtn.classList.toggle('timer-run', timer.running);
  timerBtn.classList.toggle('timer-warn', warn);
  bigTimer.classList.toggle('warn', warn);
  bigBar.style.width = (clamp(timer.rem / Math.max(1, timer.total), 0, 1) * 100) + '%';
  $$('.t-play').forEach(el => el.classList.toggle('hidden', timer.running));
  $$('.t-pause').forEach(el => el.classList.toggle('hidden', !timer.running));
  $('#tStartLabel').textContent = timer.running ? 'Pause' : 'Start';
}
function chime() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * 0.13;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.46);
    });
    setTimeout(() => ctx.close?.(), 1500);
  } catch (e) {}
}

/* =====================================================================
   Spotlight & Curtain mode
   ===================================================================== */
const spot = { on: false, mode: 'spot', x: 0, y: 0, w: 460, h: 300, curtainY: 260, dim: 0.84 };
const spotEl = $('#spot'), spotHole = $('#spotHole'), spotBar = $('#spotBar');

function toggleSpotlight(force) {
  spot.on = force !== undefined ? force : !spot.on;
  if (spot.on && !spot.x && !spot.y) {
    spot.w = Math.min(520, VW - 80); spot.h = Math.min(320, VH - 160);
    spot.x = Math.round((VW - spot.w) / 2); spot.y = Math.round((VH - spot.h) / 2);
    spot.curtainY = Math.round(VH * 0.35);
  }
  spotEl.classList.toggle('on', spot.on);
  spotBar.classList.toggle('hidden', !spot.on);

  $('#spotBtn').classList.toggle('on', spot.on);

}
function setSpotMode(m) {
  spot.mode = m;
  if (m === 'circle') { const s = Math.min(spot.w, spot.h); spot.w = spot.h = Math.max(140, s); }
  layoutSpot();
}
function layoutSpot() {

  } else {

}

/* =====================================================================
   High-resolution export (PNG, multi-page PDF, JSON board files)
   ===================================================================== */
function contentBounds(p) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (x, y, w, h) => { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x + w > x1) x1 = x + w; if (y + h > y1) y1 = y + h; };
  for (const it of p.items) { if (it.tool === 'eraser') continue; const b = itemBox(it); add(b.x, b.y, b.w, b.h); }
  for (const w of p.widgets) { const b = w.type === 'shape' ? shapeBox(w) : w; add(b.x, b.y, b.w, b.h); }
  if (!Number.isFinite(x0)) return null;
  const pad = 48;
  return { x: x0 - pad, y: y0 - pad, w: Math.max(240, x1 - x0 + 2 * pad), h: Math.max(160, y1 - y0 + 2 * pad) };
}
function renderPageToCanvas(p, b, scale, withBg) {
  const maxDim = IS_SAFARI ? 4096 : 8192;
  const maxArea = IS_SAFARI ? 16777216 : 67108864;
  let s = scale;
  if (b.w * s > maxDim) s = maxDim / b.w;
  if (b.h * s > maxDim) s = maxDim / b.h;
  if (b.w * s * b.h * s > maxArea) s = Math.sqrt(maxArea / (b.w * b.h));
  const W = Math.max(1, Math.round(b.w * s)), H = Math.max(1, Math.round(b.h * s));

  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const ctx = out.getContext('2d');
  ctx.setTransform(s, 0, 0, s, -b.x * s, -b.y * s);
  if (withBg) {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--board-bg').trim();
    ctx.fillRect(b.x, b.y, b.w, b.h);
    drawGrid(ctx, b);
  }
  for (const w of p.widgets) drawWidgetOnCanvas(ctx, w);

  if (p.items.length) {
    const ic = document.createElement('canvas');
    ic.width = W; ic.height = H;
    const ix = ic.getContext('2d');
    ix.setTransform(s, 0, 0, s, -b.x * s, -b.y * s);
    for (const it of p.items) drawStroke(ix, it);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(ic, 0, 0); ctx.restore();
  }
  return out;
}
function drawWidgetOnCanvas(ctx, w) {
  if (w.type === 'shape') { drawShape(ctx, w); return; }
  ctx.save();
  if (w.type === 'sticky') {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.22)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8;
    ctx.fillStyle = w.color;
    rr(ctx, w.x, w.y, w.w, w.h, 3); ctx.fill();
    ctx.restore();
    ctx.save();
    rr(ctx, w.x, w.y, w.w, w.h, 3); ctx.clip();
    ctx.fillStyle = '#1f2937'; ctx.textBaseline = 'top';
    ctx.font = `500 ${w.fs}px Inter, system-ui, sans-serif`;
    const lh = w.fs * 1.35, lines = wrapText(ctx, w.text || '', w.w - 28);
    lines.forEach((ln, i) => ctx.fillText(ln, w.x + 14, w.y + 16 + i * lh));
    ctx.restore();
  } else if (w.type === 'text') {
    if (!w.text) { ctx.restore(); return; }
    ctx.fillStyle = resolveColor(w.color); ctx.textBaseline = 'top';
    const fam = w.mono ? "'JetBrains Mono', monospace" : 'Inter, system-ui, sans-serif';
    ctx.font = `${w.italic ? 'italic ' : ''}${w.bold ? '700' : '400'} ${w.fs}px ${fam}`;
    const lh = w.fs * 1.3, lines = wrapText(ctx, w.text, w.w - 16);
    lines.forEach((ln, i) => ctx.fillText(ln, w.x + 8, w.y + 6 + i * lh));
  } else if (w.type === 'code') {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;
    ctx.fillStyle = '#1e1e2e';
    rr(ctx, w.x, w.y, w.w, w.h, 12); ctx.fill();
    ctx.restore();
    rr(ctx, w.x, w.y, w.w, w.h, 12); ctx.clip();
    ctx.fillStyle = '#181825'; ctx.fillRect(w.x, w.y, w.w, 34);
    ['#f38ba8', '#f9e2af', '#a6e3a1'].forEach((c, i) => {
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(w.x + 18 + i * 20, w.y + 17, 6, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = '#a6adc8'; ctx.font = "500 12px 'JetBrains Mono', monospace";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(w.title || '', w.x + w.w / 2, w.y + 17);
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.font = `400 ${w.fs}px 'JetBrains Mono', monospace`;
    const lines = String(w.text || '').split('\n'), lh = w.fs * 1.55;
    const gw = Math.max(2, String(lines.length).length) * (w.fs * 0.62) + 20;
    lines.forEach((ln, i) => {
      const y = w.y + 46 + i * lh;
      if (y > w.y + w.h) return;
      ctx.fillStyle = '#585b70'; ctx.textAlign = 'right'; ctx.fillText(String(i + 1), w.x + gw - 8, y);
      ctx.fillStyle = '#cdd6f4'; ctx.textAlign = 'left'; ctx.fillText(ln, w.x + gw + 4, y);
    });
  } else if (w.type === 'varbox') {
    const dk = isDark();
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.22)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
    ctx.fillStyle = dk ? '#26272d' : '#ffffff';
    rr(ctx, w.x, w.y, w.w, w.h, 16); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = dk ? 'rgba(255,255,255,0.08)' : 'rgba(15,23,42,0.08)'; ctx.lineWidth = 1;
    rr(ctx, w.x, w.y, w.w, w.h, 16); ctx.stroke();
    ctx.font = "600 13px 'JetBrains Mono', monospace";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#8b5cf6';
    ctx.fillText(`${w.dtype} ${w.name} = ${w.open ? w.value : '?'}`, w.x + w.w / 2, w.y + 22);
    if (w.open) {
      ctx.font = "700 16px 'JetBrains Mono', monospace";
      const tw = Math.max(64, ctx.measureText(w.value || '').width + 24), tx = w.x + (w.w - tw) / 2, ty = w.y + 46;
      ctx.fillStyle = '#4f46e5'; rr(ctx, tx, ty, tw, 34, 10); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText(w.value || '', w.x + w.w / 2, ty + 17);
    }
    const bx = w.x + 30, by = w.y + w.h - 82, bw = w.w - 60, bh = 72;
    ctx.fillStyle = '#c98c52'; rr(ctx, bx, by, bw, bh, 8); ctx.fill();
    ctx.save();
    ctx.translate(bx - 6, by);
    if (w.open) ctx.rotate(-0.48);
    ctx.fillStyle = '#e0ad74'; rr(ctx, 0, -12, bw + 12, 14, 4); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#4a2c10'; ctx.font = "700 15px 'JetBrains Mono', monospace";
    ctx.fillText(w.name || '', w.x + w.w / 2, by + 30);
    ctx.font = "500 10px 'JetBrains Mono', monospace";
    ctx.fillText(w.addr || '', w.x + w.w / 2, by + 50);
  }
  ctx.restore();
}

function exportPNG(area = 'board', scale = 2, withBg = true) {
  commitEditing();
  const p = page();
  const b = area === 'view' ? viewBounds(cam) : (contentBounds(p) || viewBounds(cam));
  const c = renderPageToCanvas(p, b, scale, withBg);
  const name = `${slug(doc.title)}-${slug(p.name)}.png`;
  c.toBlob(blob => {
    if (blob) { download(blob, name); toast(`Saved ${name} (${c.width}×${c.height}px)`, 'image-down'); }
  }, 'image/png');
}
function exportPDF(area = 'board', scale = 2, withBg = true) {
  commitEditing();
  if (!window.jspdf || !window.jspdf.jsPDF) { toast('PDF library is still loading — try again in a moment', 'alert-circle'); return; }
  const { jsPDF } = window.jspdf;
  let pdf = null;
  doc.pages.forEach((p, idx) => {
    const b = area === 'view' ? viewBounds(p.cam) : (contentBounds(p) || viewBounds(p.cam));
    const c = renderPageToCanvas(p, b, scale, withBg);
    const orient = c.width >= c.height ? 'l' : 'p';
    if (!pdf) pdf = new jsPDF({ orientation: orient, unit: 'px', format: [c.width, c.height], compress: true });
    else pdf.addPage([c.width, c.height], orient);
    pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, c.width, c.height);
  });
  const name = `${slug(doc.title)}.pdf`;
  pdf.save(name);
  toast(`Saved ${name} (${doc.pages.length} page${doc.pages.length > 1 ? 's' : ''})`, 'file-check-2');
}
function saveBoardFile() {
  commitEditing();
  const payload = JSON.stringify({ app: 'LumenBoard', version: 1, savedAt: new Date().toISOString(), prefs: { bg: prefs.bg, theme: prefs.theme }, doc }, null, 2);
  const name = `${slug(doc.title)}.lumenboard.json`;
  download(new Blob([payload], { type: 'application/json' }), name);
  toast(`Saved ${name}`, 'download');
}
function openBoardFile(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      const raw = data && data.doc ? data.doc : data;
      if (!validDoc(raw)) throw new Error('Invalid file');
      doc = normalizeDoc(raw);
      if (data.prefs && data.prefs.bg && BG_TYPES.some(b => b[0] === data.prefs.bg)) prefs.bg = data.prefs.bg;
      hist.clear(); thumbs.clear(); staleThumbs.clear();
      selectedId = null; editingId = null;
      cam = page().cam;
      titleInput.value = doc.title;
      document.title = `${doc.title} — Lumen Board`;
      renderWidgets(); applyCamera(); updateUndoUI(); markAllThumbsStale(); renderDrawer(); saveNow();
      toast(`Opened "${doc.title}"`, 'folder-open');
    } catch (err) { toast('Could not read that board file', 'alert-triangle'); }
  };
  r.readAsText(file);
}
$('#fileInput').addEventListener('change', e => { const f = e.target.files[0]; if (f) openBoardFile(f); e.target.value = ''; });
$('#fileMenu').addEventListener('click', e => {
  const b = e.target.closest('[data-file]');
  if (!b) return;
  closeMenus();
  const k = b.dataset.file;
  if (k === 'save') saveBoardFile();
  else if (k === 'open') $('#fileInput').click();
  else if (k === 'png-view') exportPNG('view', 2, true);
  else if (k === 'png-board') exportPNG('board', 2, true);
  else if (k === 'pdf') exportPDF('board', 2, true);

   ===================================================================== */
let tipTarget = null;
window.addEventListener('pointerover', e => {
  if (e.pointerType === 'touch') return;
  const el = e.target.closest('[data-tip]');
  if (el === tipTarget) return;
  tipTarget = el;
  if (!el) { tipEl.classList.remove('show'); return; }
  const k = (el.dataset.key || '').replace('Mod', MOD);
  tipEl.innerHTML = `<span>${esc(el.dataset.tip)}</span>` + (k ? `<span class="k">${esc(k)}</span>` : '');
  tipEl.classList.add('show');
  const r = el.getBoundingClientRect(), tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  const top = r.top > VH - 110 ? r.top - th - 10 : r.bottom + 10;
  const left = clamp(r.left + r.width / 2 - tw / 2, 8, VW - tw - 8);
  tipEl.style.left = Math.round(left) + 'px';
  tipEl.style.top = Math.round(clamp(top, 8, VH - th - 8)) + 'px';
});
window.addEventListener('pointerdown', () => tipEl.classList.remove('show'));

function toast(msg, icon = 'check-circle-2') {
  const box = $('#toasts'), el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<i data-lucide="${icon}"></i><span>${esc(msg)}</span>`;
  box.appendChild(el);
  icons();
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 260); }, 2400);
}

/* =====================================================================
   Keyboard shortcuts
   ===================================================================== */
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!modal.classList.contains('hidden')) { closeModal(); return; }
    if (document.querySelector('.pop.open')) { closeMenus(); return; }
    if (editingId) { commitEditing(); return; }
    if (spot.on) { toggleSpotlight(false); return; }
    if (selectedId) { selectWidget(null); return; }
    if (tool !== 'select') { setTool('select', true); return; }
  }
  const mod = e.ctrlKey || e.metaKey;
  const k = e.key.toLowerCase();
  if (mod && k === 's') { e.preventDefault(); saveBoardFile(); return; }
  if (mod && k === 'o') { e.preventDefault(); $('#fileInput').click(); return; }
  if (mod && k === 'e') { e.preventDefault(); openExportModal(); return; }

  if (isTyping(e.target) || !modal.classList.contains('hidden')) return;

  if (e.code === 'Space' && !spaceDown) { spaceDown = true; board.classList.add('space'); updateRing(e); e.preventDefault(); return; }
  if (mod && k === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'd' && selectedId) { e.preventDefault(); duplicateSelected(); return; }
  if (mod) return;

  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId) { e.preventDefault(); deleteSelected(); return; }
  if (spot.on && spot.mode === 'curtain' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    spot.curtainY = clamp(spot.curtainY + (e.key === 'ArrowDown' ? 48 : -48), 0, VH);
    layoutSpot();
    return;
  }
  if (selectedId && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
    e.preventDefault();
    const step = e.shiftKey ? 10 : 2, w = findWidget(selectedId), el = widgetEl(selectedId);
    if (!w || !el) return;
    pushHistory();
    const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
    const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
    if (w.type === 'shape' && isLine(w)) { w.x1 += dx; w.y1 += dy; w.x2 += dx; w.y2 += dy; }
    else { w.x += dx; w.y += dy; }
    syncWidget(el, w); positionCtxBar(); markChanged();
    return;
  }
  if (TOOL_KEYS[k]) { setTool(TOOL_KEYS[k]); return; }
  if (SPAWN_KEYS[k]) { spawnWidget(SPAWN_KEYS[k]); return; }
  if (k === 'f') { toggleSpotlight(); return; }
  if (k === 'd') { toggleTheme(); return; }
  if (k === 'g') {
    const idx = (BG_TYPES.findIndex(b => b[0] === prefs.bg) + 1) % BG_TYPES.length;
    prefs.bg = BG_TYPES[idx][0]; savePrefs(); updateBackground(); markAllThumbsStale();
    toast(`Background: ${BG_TYPES[idx][1]}`, BG_TYPES[idx][2]);
    return;
  }
  if (e.key === '[') { setDrawer(drawer.classList.contains('closed')); return; }
  if (e.key === ']' && selectedId) { reorderSelected(1); return; }
  if (e.key === '?' || (e.shiftKey && e.key === '/')) { openShortcutsModal(); return; }
  if (e.key === '=' || e.key === '+') { zoomBy(1.25); return; }
  if (e.key === '-' || e.key === '_') { zoomBy(0.8); return; }
  if (e.key === '0') { resetZoom(); return; }
  if (e.key === '1') { zoomToFit(); return; }
  if (e.key === 'PageUp') { e.preventDefault(); switchPage(doc.current - 1); return; }
  if (e.key === 'PageDown') { e.preventDefault(); switchPage(doc.current + 1); return; }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') { spaceDown = false; board.classList.remove('space'); } });
window.addEventListener('blur', () => { spaceDown = false; board.classList.remove('space', 'panning'); pointers.clear(); pinch = null; });

/* =====================================================================
   Resize & initialization
   ===================================================================== */
function resize() {
  const oldW = VW, oldH = VH;
  VW = innerWidth; VH = innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  for (const c of [inkC, liveC, laserC]) {
    c.width = Math.round(VW * dpr); c.height = Math.round(VH * dpr);
    c.style.width = VW + 'px'; c.style.height = VH + 'px';
  }
  if (oldW && oldH) { cam.x += (VW - oldW) / 2; cam.y += (VH - oldH) / 2; }
  applyCamera();
  updateDock();
  if (spot.on) layoutSpot();
}
window.addEventListener('resize', resize);

$$('[data-mod]').forEach(el => { el.textContent = el.textContent.replace('Mod', MOD); });
icons();
renderWidgets();
resize();
updateUndoUI();
updatePageUI();
if (prefs.drawer) setDrawer(true);
requestAnimationFrame( updateDock );
})();
</script>
</body>
